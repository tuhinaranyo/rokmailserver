# Dovecot's global sieve script files "X-Spam: Yes" into Junk. remove = 0 strips
# any X-Spam header a sender put on the message.
use = ["spam-header", "authentication-results"];
routines {
  spam-header {
    header = "X-Spam";
    value = "Yes";
    remove = 0;
  }
}
authenticated_headers = ["authentication-results"];
