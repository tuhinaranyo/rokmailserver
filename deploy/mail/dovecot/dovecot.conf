# Dovecot 2.3 syntax. Host name and TLS paths come from /run/rokmail/dovecot-env.conf
# (written by entrypoint.sh).
protocols = imap lmtp
# IPv4 only, like Postfix (inet_protocols); containers often have no IPv6.
listen = *
log_path = /dev/stderr
auth_username_format = %Lu
auth_mechanisms = plain login
# bcrypt is slow by design; a password mismatch bypasses the cache, so a changed
# password works at once, a disabled account at most auth_cache_ttl later.
auth_cache_size = 10M
auth_cache_ttl = 5 min
auth_cache_negative_ttl = 1 min

ssl = required
ssl_cert = </run/rokmail/tls/fullchain.pem
ssl_key = </run/rokmail/tls/privkey.pem
ssl_min_protocol = TLSv1.2

mail_location = maildir:~/Maildir
first_valid_uid = 5000
mail_plugins = $mail_plugins quota
!include_try /run/rokmail/dovecot-env.conf

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30d
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30d
  }
}

# IMAPS only: no plain imap listener, no POP3.
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
# Sockets live in Postfix's queue directory (Postfix is not chrooted).
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  quota = maildir:User quota
  # Over-quota mail is refused at LMTP, so Postfix bounces it with this text.
  quota_exceeded_message = Mailbox is over quota; the recipient must free up space.
  sieve_before = /etc/dovecot/sieve/before.sieve
}
